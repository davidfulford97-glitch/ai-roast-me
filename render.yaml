services:
  - type: web
    name: ai-roast-me
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CASHAPP_TAG
        value: "$aireastme"
      - key: VENMO_TAG
        value: "@airoastme"
      - key: SECRET_KEY
        generateValue: true
    plan: free
    healthCheckPath: /
    autoDeploy: true
